# Vibe City + Hermes in one container (see Dockerfile).
#
#   docker compose up -d --build     # no .env needed; .env.example lists what can be set
#   then open http://127.0.0.1:4100
#
# The API has no login. It is published on loopback only; to reach it remotely use an SSH tunnel or a reverse
# proxy that authenticates. Model/provider credentials go in .env.hermes (optional, never baked into the image).
services:
  vibe-city:
    build:
      context: .
      args:
        HERMES_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:d27689bc6e8581ec884a7227c9101fdaebf6c853cff8859020dac14f21452b4d}
    image: ${VIBE_CITY_IMAGE:-vibe-city:local}
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      - "127.0.0.1:${VIBE_CITY_PORT:-4100}:4100"
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      # Empty = the container generates one at start (docker/cont-init.d/00-vibe-city-token).
      HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:-}
      # The browser origins allowed on the live WebSocket: they follow the published port.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:${VIBE_CITY_PORT:-4100},http://localhost:${VIBE_CITY_PORT:-4100}}
      # NEAR AI Cloud (OpenAI-compatible) is the default model provider when the key is set; see DEPLOYMENT.md.
      NEAR_AI_API_KEY: ${NEAR_AI_API_KEY:-}
      NEAR_AI_BASE_URL: ${NEAR_AI_BASE_URL:-https://cloud-api.near.ai/v1}
      NEAR_AI_MODEL: ${NEAR_AI_MODEL:-deepseek-ai/DeepSeek-V4.1-Flash-1017}
      NEAR_AI_REASONING_EFFORT: ${NEAR_AI_REASONING_EFFORT:-high}
    env_file:
      - path: .env.hermes
        required: false
    volumes:
      - hermes_data:/opt/data

volumes:
  hermes_data:
