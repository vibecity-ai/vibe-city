name: Docker
on:
  push:
    branches: [main]
    tags: ['v*']
    # Only changes that can affect the image (path filters are not applied to tag pushes).
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker/**
      - scripts/docker-smoke.sh
      - apps/**
      - packages/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker/**
      - scripts/docker-smoke.sh
      - apps/**
      - packages/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - .github/workflows/docker.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Pinned by digest (same default as the Dockerfile); override with the HERMES_IMAGE repository variable.
  HERMES_IMAGE: ${{ vars.HERMES_IMAGE || 'nousresearch/hermes-agent@sha256:d27689bc6e8581ec884a7227c9101fdaebf6c853cff8859020dac14f21452b4d' }}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build with the daemon's own BuildKit: the ~4.6 GB Hermes base is pulled straight into the daemon and the result
      # lands there too, instead of being exported from a builder container and re-imported as a tarball.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Pull the Hermes base
        run: docker pull "$HERMES_IMAGE"
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vibe-city:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HERMES_IMAGE=${{ env.HERMES_IMAGE }}
      - name: Smoke test
        run: VIBE_CITY_IMAGE=vibe-city:ci ./scripts/docker-smoke.sh
      # Publish only from main or a tag, and only the image that just passed the smoke test (no second build).
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker tag vibe-city:ci "$t"
            docker push "$t"
          done
