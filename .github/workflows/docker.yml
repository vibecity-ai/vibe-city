name: Docker
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Override with a repository variable to pin the Hermes base image by digest.
  HERMES_IMAGE: ${{ vars.HERMES_IMAGE || 'nousresearch/hermes-agent:latest' }}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      # Build once into the local daemon and smoke-test exactly what would be published.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vibe-city:ci
          build-args: HERMES_IMAGE=${{ env.HERMES_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: VIBE_CITY_IMAGE=vibe-city:ci ./scripts/docker-smoke.sh
      # Publish only from main or a tag, and only after the smoke test passed (layers come from cache).
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HERMES_IMAGE=${{ env.HERMES_IMAGE }}
          cache-from: type=gha
