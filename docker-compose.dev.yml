# Development: only Hermes runs in Docker; the backend and web app run on the host with Node (see DEPLOYMENT.md, "Develop").
#
#   npm run dev:hermes    # this file: Hermes gateway + dashboard
#   npm run dev:backend   # http://127.0.0.1:4100, restarts on save, drives this container (scripts/hermes-docker)
#   npm run dev:web       # http://localhost:4200, hot reload, proxies /api to the backend
#
# Host networking (Linux): the dashboard (9119) and the gateway API server (8642) are on the host's loopback, and Hermes
# reaches the backend's MCP server at 127.0.0.1:4100, exactly as inside the production container.
# Hermes' data lives in ./.dev/hermes (bind mount), so it survives `down`/rebuilds; delete it for a fresh Hermes.
services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:d27689bc6e8581ec884a7227c9101fdaebf6c853cff8859020dac14f21452b4d}
    container_name: vibe-city-hermes-dev
    network_mode: host
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      # Same uid as you, so files in ./.dev/hermes stay writable by the backend.
      HERMES_UID: ${DEV_UID:-1000}
      HERMES_GID: ${DEV_GID:-1000}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:?set HERMES_DASHBOARD_SESSION_TOKEN in .env (openssl rand -hex 24)}
      NEAR_AI_API_KEY: ${NEAR_AI_API_KEY:-}
      NEAR_AI_BASE_URL: ${NEAR_AI_BASE_URL:-https://cloud-api.near.ai/v1}
      NEAR_AI_MODEL: ${NEAR_AI_MODEL:-deepseek/deepseek-v4.1-flash}
      NEAR_AI_REASONING_EFFORT: ${NEAR_AI_REASONING_EFFORT:-high}
    env_file:
      - path: .env.hermes
        required: false
    volumes:
      - ./.dev/hermes:/opt/data
      - ./docker/cont-init.d/03-vibe-city-near:/etc/cont-init.d/03-vibe-city-near:ro
